- name: Récupérer les versions (rôle réutilisé)
  ansible.builtin.include_role:
    name: app_versions

- name: Évaluer l'exposition aux dernières CVE
  vars:
    _baseline: "{{ security_baseline[app_runtime] }}"
    _fixed_in: "{{ _baseline.fixed_in[app_branch] | default('') }}"
    _cycle: "{{ eol_data[app_runtime] | selectattr('cycle', 'equalto', app_branch) | first | default({}) }}"
  ansible.builtin.set_fact:
    cve_fixed_in: "{{ _fixed_in if _fixed_in else 'aucun' }}"
    cve_latest: "{{ _cycle.latest | default('?') }}"
    cve_eol: "{{ _cycle.eol | default('?') }}"
    cve_status: >-
      {%- if not _fixed_in -%} EOL
      {%- elif app_version is version(_fixed_in, '<') -%} VULNERABLE
      {%- else -%} OK
      {%- endif -%}

- name: Afficher le verdict
  ansible.builtin.debug:
    msg: "{{ app_runtime }} {{ app_version }} -> {{ cve_status }} (corrigé en {{ cve_fixed_in }}, dernière {{ cve_latest }}, EOL {{ cve_eol }})"
