[defaults]
# dossier : hosts.yml (statique) puis zz-constructed.yml (groupes calculés)
inventory          = inventory/
roles_path         = roles
collections_path   = collections:~/.ansible/collections:/usr/share/ansible/collections
host_key_checking  = False
forks              = 10
# Sortie YAML lisible + temps par tâche (pratique en démo)
stdout_callback    = ansible.builtin.default
result_format      = yaml
callbacks_enabled  = ansible.posix.profile_tasks
interpreter_python = auto_silent
retry_files_enabled = False
# Cache de facts : réutilisé par l'inventaire "constructed" (keyed_groups)
gathering               = smart
fact_caching            = ansible.builtin.jsonfile
fact_caching_connection = .facts_cache
fact_caching_timeout    = 86400
# ansible-core 2.21 : "-o" (callback oneline) est déprécié -> on masque l'avertissement en démo
deprecation_warnings = False

[ssh_connection]
# En prod (SSH) : réduit fortement le nombre d'aller-retours
pipelining = True
