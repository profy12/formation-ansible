# Inventaire statique YAML : groupes fonctionnels (web, api)
# croisés avec des groupes d'environnement (staging, prod).
all:
  children:
    web:
      hosts:
        web1:
          ansible_host: lab-web1
        web2:
          ansible_host: lab-web2
        web3:
          ansible_host: lab-web3
    api:
      hosts:
        api1:
          ansible_host: lab-api1
        api2:
          ansible_host: lab-api2
        api3:
          ansible_host: lab-api3
    staging:
      hosts:
        web1:
        api1:
    prod:
      hosts:
        web2:
        web3:
        api2:
        api3:
